<svg viewBox="0 0 730 425" width="730" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Prefix-cache hit rate: three measured workload steps drive a vLLM serving backend whose Prometheus counters report the measured 69.47 percent hit rate against a 70 percent target">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .title { font-size: 16px; fill: #1e293b; font-weight: 600; }
    .grouptitle { font-size: 11px; fill: #64748b; }
    .step { font-size: 12px; fill: #1e40af; font-weight: 600; }
    .step-sub { font-size: 10px; fill: #1e40af; }
    .proc { font-size: 12px; fill: #b45309; font-weight: 600; }
    .boxhead { font-size: 12px; fill: #1e293b; font-weight: 600; }
    .boxline { font-size: 10px; fill: #64748b; }
    .result { font-size: 12px; fill: #166534; font-weight: 600; }
    .result-sub { font-size: 10px; fill: #166534; }
    .muted { font-size: 10px; fill: #64748b; }
    .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 6,4; }
    .input { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; }
    .processing { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1; }
    .data { fill: #d1fae5; stroke: #22c55e; stroke-width: 1; }
    .inner { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <text class="title" x="365" y="36" text-anchor="middle">Prefix-cache hit rate: measured, not assumed</text>

  <!-- ── Layer 1: dashed grouping box (serving backend) ──────────────── -->
  <!-- Serving backend group: x=416, y=122, width=280, height=176, right edge=696, bottom edge=298 -->
  <rect class="group" x="416" y="122" width="280" height="176" rx="10"/>
  <text class="grouptitle" x="426" y="136">Serving backend (vLLM)</text>

  <!-- ── Layer 2: connectors ─────────────────────────────────────────── -->
  <!-- Step 1 -> step 2: source bottom 118, target top 146 -->
  <path d="M208,123 L 208,135" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Step 2 -> step 3: source bottom 200, target top 228 -->
  <path d="M208,205 L 208,217" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Step 3 -> backend group: source right 388, group left 416 -->
  <path d="M393,255 L 405,255" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Backend group -> result: group bottom 298, result top 323 -->
  <path d="M556,303 L 556,312" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Layer 3: boxes and text ─────────────────────────────────────── -->
  <!-- Left column, step 1: x=28, y=64, width=360, height=54, right=388, bottom=118 -->
  <rect class="input" x="28" y="64" width="360" height="54" rx="8"/>
  <text class="step" x="208" y="84" text-anchor="middle">Build workload with a known shared fraction</text>
  <text class="step-sub" x="208" y="102" text-anchor="middle">70% target &#183; 2 distinct prefixes</text>

  <!-- Left column, step 2 (prefill): x=28, y=146, width=360, height=54, right=388, bottom=200 -->
  <rect class="processing" x="28" y="146" width="360" height="54" rx="8"/>
  <text class="proc" x="208" y="177" text-anchor="middle">Prefill the distinct prefixes into the KV cache</text>

  <!-- Left column, step 3: x=28, y=228, width=360, height=54, right=388, bottom=282 -->
  <rect class="input" x="28" y="228" width="360" height="54" rx="8"/>
  <text class="step" x="208" y="259" text-anchor="middle">Fire N measured requests (concurrency 4)</text>

  <!-- Inside the group: KV cache, x=432, y=146, width=248, height=54, right=680, bottom=200 -->
  <rect class="inner" x="432" y="146" width="248" height="54" rx="6"/>
  <text class="boxhead" x="556" y="166" text-anchor="middle">KV cache</text>
  <text class="boxline" x="556" y="184" text-anchor="middle">content-addressed, fills lazily</text>

  <!-- Inside the group: Prometheus counters, x=432, y=228, width=248, height=54, right=680, bottom=282 -->
  <rect class="inner" x="432" y="228" width="248" height="54" rx="6"/>
  <text class="boxhead" x="556" y="248" text-anchor="middle">Prometheus counters</text>
  <text class="boxline" x="556" y="266" text-anchor="middle">prefix_cache_hits_total / queries_total</text>

  <!-- Result: x=416, y=323, width=280, height=54, right=696, bottom=377 -->
  <rect class="data" x="416" y="323" width="280" height="54" rx="8"/>
  <text class="result" x="556" y="343" text-anchor="middle">TARGET 70.00%  vs  MEASURED 69.47%</text>
  <text class="result-sub" x="556" y="361" text-anchor="middle">read from the counter delta, not inferred</text>

  <!-- Muted annotation under the result -->
  <text class="muted" x="556" y="397" text-anchor="middle">40 requests &#183; 2 distinct prefixes &#183; cache reset first</text>
</svg>
