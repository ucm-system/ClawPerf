<svg viewBox="0 0 670 442" width="670" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="agent mode: the model under test and a per-task tool sandbox form a closed loop of tool call and tool result, producing a measured per-task result">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .title { font-size: 16px; fill: #1e293b; font-weight: 600; }
    .grouptitle { font-size: 11px; fill: #64748b; }
    .model { font-size: 12px; fill: #6b21a8; font-weight: 600; }
    .tool { font-size: 12px; fill: #1e40af; }
    .arrowlabel { font-size: 10px; fill: #64748b; }
    .note { font-size: 10px; fill: #64748b; }
    .metric { font-size: 12px; fill: #166534; }
    .metric-sub { font-size: 10px; fill: #64748b; }
    .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 6,4; }
    .modelbox { fill: #f3e8ff; stroke: #a855f7; stroke-width: 1; }
    .toolbox { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; }
    .result { fill: #d1fae5; stroke: #22c55e; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <text class="title" x="335" y="36" text-anchor="middle">agent mode: the model really works, inside a loop</text>

  <!-- ── Tool sandbox: x=315, y=88, width=330, height=184, right=645, bottom=272 ── -->
  <rect class="group" x="315" y="88" width="330" height="184" rx="10"/>
  <text class="grouptitle" x="325" y="102">Tool sandbox (per task workspace)</text>

  <rect class="toolbox" x="340" y="120" width="280" height="36" rx="6"/>
  <text class="tool" x="480" y="142" text-anchor="middle">read file</text>

  <rect class="toolbox" x="340" y="168" width="280" height="36" rx="6"/>
  <text class="tool" x="480" y="190" text-anchor="middle">edit file</text>

  <rect class="toolbox" x="340" y="216" width="280" height="36" rx="6"/>
  <text class="tool" x="480" y="238" text-anchor="middle">run shell command</text>

  <!-- ── Model under test: x=25, y=153, width=210, height=54, right=235, bottom=207 ── -->
  <rect class="modelbox" x="25" y="153" width="210" height="54" rx="8"/>
  <text class="model" x="130" y="184" text-anchor="middle">Model under test</text>
  <text class="note" x="130" y="225" text-anchor="middle">context grows every step —</text>
  <text class="note" x="130" y="241" text-anchor="middle">history + tool output accumulate</text>

  <!-- ── Loop connectors: call out at y=138, result back at y=195 ────────────── -->
  <path d="M240,138 L 304,138" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="arrowlabel" x="275" y="125" text-anchor="middle">tool call</text>
  <text class="arrowlabel" x="275" y="180" text-anchor="middle">tool result</text>

  <text class="arrowlabel" x="370" y="320" text-anchor="middle">repeat until the task completes or --agent-max-steps is reached</text>

  <!-- ── Measured result: x=25, y=340, width=620, height=54, right=645, bottom=394 ── -->
  <rect class="result" x="25" y="340" width="620" height="54" rx="8"/>
  <text class="metric" x="335" y="360" text-anchor="middle">measured per task: TTFT per step · generated tokens · tool calls · completion rate</text>
  <text class="metric-sub" x="335" y="378" text-anchor="middle">real Ascend 910B3 run: 2/2 tasks completed · P50 TTFT 90 ms</text>

  <text class="note" x="25" y="414">needs tool calling on the endpoint (vLLM: --enable-auto-tool-choice --tool-call-parser qwen3_xml)</text>

  <!-- ── Cross-layer loop-back line: painted last so it reads over the boxes ── -->
  <path d="M400,277 C 400,350 266,195 246,195" fill="none" stroke="#64748b"
        stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
</svg>
