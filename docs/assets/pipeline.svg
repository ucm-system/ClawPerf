<svg viewBox="0 0 800 405" width="800" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="ClawPerf pipeline: seven workload modes feed a runner that drives a serving backend and polls its metrics, producing JSON, Markdown and history outputs">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .title { font-size: 16px; fill: #1e293b; font-weight: 600; }
    .grouptitle { font-size: 11px; fill: #64748b; }
    .chip { font-size: 11px; fill: #1e40af; }
    .boxhead { font-size: 12px; fill: #1e293b; font-weight: 600; }
    .boxline { font-size: 10px; fill: #1e293b; }
    .purple { font-size: 11px; fill: #6b21a8; }
    .green { font-size: 11px; fill: #166534; }
    .out { font-size: 11px; fill: #1e293b; }
    .arrowlabel { font-size: 10px; fill: #64748b; }
    .group { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 6,4; }
    .chipbox { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1; }
    .backend { fill: #f3e8ff; stroke: #a855f7; stroke-width: 1; }
    .cache { fill: #d1fae5; stroke: #22c55e; stroke-width: 1; }
    .outbox { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
  </style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <text class="title" x="400" y="36" text-anchor="middle">ClawPerf pipeline: workload → runner → backend → verdict</text>

  <!-- ── Workload modes ───────────────────────────────────────────────── -->
  <rect class="group" x="40" y="70" width="210" height="164" rx="10"/>
  <text class="grouptitle" x="50" y="84">Workload (7 modes)</text>

  <rect class="chipbox" x="55" y="92" width="86" height="26" rx="6"/>
  <text class="chip" x="98" y="109" text-anchor="middle">scenario</text>
  <rect class="chipbox" x="149" y="92" width="86" height="26" rx="6"/>
  <text class="chip" x="192" y="109" text-anchor="middle">hitrate</text>

  <rect class="chipbox" x="55" y="126" width="86" height="26" rx="6"/>
  <text class="chip" x="98" y="143" text-anchor="middle">slo</text>
  <rect class="chipbox" x="149" y="126" width="86" height="26" rx="6"/>
  <text class="chip" x="192" y="143" text-anchor="middle">agent</text>

  <rect class="chipbox" x="55" y="160" width="86" height="26" rx="6"/>
  <text class="chip" x="98" y="177" text-anchor="middle">trace</text>
  <rect class="chipbox" x="149" y="160" width="86" height="26" rx="6"/>
  <text class="chip" x="192" y="177" text-anchor="middle">record</text>

  <rect class="chipbox" x="55" y="194" width="180" height="26" rx="6"/>
  <text class="chip" x="145" y="211" text-anchor="middle">replay</text>

  <!-- ── Runner ───────────────────────────────────────────────────────── -->
  <rect class="outbox" x="290" y="110" width="200" height="120" rx="8"/>
  <text class="boxhead" x="306" y="132">Runner</text>
  <text class="boxline" x="306" y="152">· context assembly + compaction</text>
  <text class="boxline" x="306" y="168">· arrival / request-rate pacing</text>
  <text class="boxline" x="306" y="184">· TTFT · TPOT · ITL timing</text>
  <text class="boxline" x="306" y="200">· Prometheus polling</text>

  <!-- ── Serving backend ─────────────────────────────────────────────── -->
  <rect class="group" x="560" y="70" width="200" height="180" rx="10"/>
  <text class="grouptitle" x="570" y="84">Serving backend</text>

  <rect class="backend" x="575" y="100" width="170" height="54" rx="6"/>
  <text class="purple" x="660" y="122" text-anchor="middle">vLLM · SGLang</text>
  <text class="purple" x="660" y="140" text-anchor="middle">MindIE · vllm-ascend</text>

  <rect class="cache" x="575" y="179" width="170" height="54" rx="6"/>
  <text class="green" x="660" y="201" text-anchor="middle">Prefix cache</text>
  <text class="green" x="660" y="219" text-anchor="middle">+ /metrics per instance</text>

  <!-- ── Connectors ──────────────────────────────────────────────────── -->
  <path d="M255,170 L 279,170" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M495,150 L 549,150" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="arrowlabel" x="522" y="140" text-anchor="middle">requests</text>
  <path d="M555,200 L 501,200" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="arrowlabel" x="528" y="218" text-anchor="middle">/metrics ×N</text>

  <path d="M390,235 L 390,279" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── Outputs ─────────────────────────────────────────────────────── -->
  <rect class="group" x="290" y="290" width="470" height="86" rx="10"/>
  <text class="grouptitle" x="300" y="304">Outputs</text>

  <rect class="outbox" x="305" y="320" width="140" height="40" rx="6"/>
  <text class="out" x="375" y="335" text-anchor="middle">results.json</text>
  <text class="out" x="375" y="353" text-anchor="middle" fill="#64748b">config + summary</text>

  <rect class="outbox" x="457" y="320" width="140" height="40" rx="6"/>
  <text class="out" x="527" y="335" text-anchor="middle">report.md</text>
  <text class="out" x="527" y="353" text-anchor="middle" fill="#64748b">verdict + charts</text>

  <rect class="outbox" x="609" y="320" width="140" height="40" rx="6"/>
  <text class="out" x="679" y="335" text-anchor="middle">history.jsonl</text>
  <text class="out" x="679" y="353" text-anchor="middle" fill="#64748b">one line per run</text>
</svg>
