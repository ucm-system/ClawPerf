name: Pages

# Publishes the MkDocs build as the project site:
#   https://ucm-system.github.io/ClawPerf/       (English, the default locale)
#   https://ucm-system.github.io/ClawPerf/zh/    (Chinese)
#
# One-time setup: Settings → Pages → Build and deployment → Source =
# "GitHub Actions". After that this workflow owns the site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "src/clawperf/**"
      - "scripts/check_site.py"
      - "scripts/check_layout.py"
      - "scripts/check_diagrams.py"
      - "scripts/gen_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package and the docs toolchain
        # Pinned through the [docs] extra: MkDocs 2.0 is announced as breaking
        # plugins and themes outright, so upgrades must be deliberate.
        run: python3 -m pip install -e ".[docs]"

      - name: Validate the sources
        # Missing translations, dead links, an unused diagram and leftovers from
        # the hand-written site all fail here.
        run: python3 scripts/check_site.py

      - name: The generated pages match the code
        # docs/*.md list every flag with its help text and default; if they
        # drift from clawperf --help the site would quietly lie.
        run: python3 scripts/gen_site.py --check

      - name: Validate the diagram geometry
        # Overlapping boxes, clipped labels and detached arrows are caught by
        # the same rules the diagrams were drawn against.
        run: python3 scripts/check_diagrams.py docs/assets

      - name: Build the site strictly
        run: python3 -m mkdocs build --strict

      - name: Measure the built pages in real Chrome
        # Nav, language switcher targets, code-copy buttons (after JS), images
        # and horizontal overflow at desktop and phone widths.
        run: python3 scripts/check_layout.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
